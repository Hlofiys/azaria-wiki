<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- PWA Meta Tags -->
		<meta name="theme-color" content="#17121b" />
		<meta name="background-color" content="#17121b" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Азария Вики" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="msapplication-TileColor" content="#c9a876" />
		<meta name="msapplication-config" content="/browserconfig.xml" />

		<!-- PWA Manifest -->
		<link rel="manifest" href="/manifest.json" />

		<!-- Apple Touch Icons -->
		<link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

		<!-- Self-hosted fonts (Prata / Lora / IBM Plex Mono) -->
		<link
			rel="preload"
			href="/fonts/prata-cyrillic.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/prata-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/lora-cyrillic.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/lora-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/ibm-plex-mono-400-cyrillic.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/ibm-plex-mono-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
		<style>
			/* Critical CSS to prevent FOUC — mirrors the tokens in src/app.css */
			html {
				background-color: #17121b;
				color-scheme: dark;
			}
			body {
				margin: 0;
				background-color: #17121b;
				color: #ede3d1;
				font-family: 'Lora', Georgia, serif;
			}
			h1,
			h2 {
				color: #ede3d1;
				font-family: 'Prata', 'Lora', Georgia, serif;
				font-weight: 400;
			}
			a {
				color: #c9a876;
				text-decoration: none;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-theme="azaria">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if (window.netlifyIdentity) {
				window.netlifyIdentity.on('init', (user) => {
					if (!user) {
						window.netlifyIdentity.on('login', () => {
							document.location.href = '/admin/';
						});
					}
				});
			}
		</script>
	</body>
</html>
