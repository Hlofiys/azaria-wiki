name: Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  checks:
    name: svelte-check + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (svelte-check)
        run: npm run check

      - name: Lint (prettier + eslint)
        run: npm run lint

  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t azaria-wiki:ci .

      - name: Smoke test
        run: bash scripts/smoke-test.sh azaria-wiki:ci
