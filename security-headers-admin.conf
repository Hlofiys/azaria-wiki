# Security headers for the admin area (Sveltia CMS) — /admin/ only.
#
# Same as security-headers.conf, but the CSP additionally allows:
#   - unpkg.com          — CMS bundle, locale files, version checks
#   - api.github.com     — GitHub API (GraphQL/REST) used by the CMS
#   - www.githubstatus.com — CMS service-status banner
#   - cdn.jsdelivr.net   — CMS UI fonts (Fontsource)
#   - blob:/data:        — image/media previews and iframes inside the CMS
# nginx: a location with its own add_header drops server-level headers,
# so this file is include'd inside the /admin/ location directly.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.iconify.design https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-src 'self' blob:; connect-src 'self' https://api.iconify.design https://api.github.com https://unpkg.com https://www.githubstatus.com; manifest-src 'self' blob:;" always;
