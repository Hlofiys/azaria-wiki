# Azaria Wiki - Docker Compose Configuration

services:
  azaria-wiki:
    image: ghcr.io/hlofiys/azaria-wiki:latest
    container_name: azaria-wiki
    restart: unless-stopped

    # Port mapping: nginx listens on port 80 inside the image
    ports:
      - '8080:80'

    environment:
      - NODE_ENV=production

    # Health check (127.0.0.1, не localhost: busybox-wget уходит в IPv6, а nginx слушает IPv4)
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
