# Azaria Wiki - Docker Compose Configuration

services:
  azaria-wiki:
    image: ghcr.io/hlofiys/azaria-wiki:latest
    container_name: azaria-wiki
    restart: unless-stopped

    # Port mapping: nginx listens on port 80 inside the image
    ports:
      - '8080:80'

    environment:
      - NODE_ENV=production

    # Health check
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
