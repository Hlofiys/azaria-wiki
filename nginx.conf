# Nginx config for the Azaria Wiki static build (SvelteKit adapter-static output).
#
# IMPORTANT: next to every article `<slug>.html` the build contains a directory
# `<slug>/` with __data.json — so `$uri.html` MUST be tried before `$uri/`.
# The old order made nginx match the directory, redirect to `/slug/` and then
# answer 403 for every direct article link (F5, shared URLs, crawlers).
# scripts/smoke-test.sh guards against this regression.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_static on;  # serve the precompressed .gz files produced by adapter-static
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---- Security headers (server level) ----
    # nginx drops server-level add_header in any location that declares its own
    # add_header, so every such location includes this file again.
    include /etc/nginx/security-headers.conf;

    # ---- Service worker / PWA runtime: never cache long ----
    location = /sw.js {
        expires -1;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /registerSW.js {
        expires -1;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location ~ ^/workbox-.*\.js$ {
        expires -1;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ---- Immutable assets ----
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 6M;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(webmanifest|manifest\.json)$ {
        expires 1w;
        add_header Cache-Control "public" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ---- Health check for Docker / orchestrators ----
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ---- HTML pages: short cache with revalidation ----
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ---- Trailing-slash URLs: /slug/ -> /slug.html (old links keep working) ----
    location ~ ^(.+)/$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        include /etc/nginx/security-headers.conf;
        try_files /$1/index.html /$1.html $uri /index.html;
    }

    # ---- Clean URLs: /characters/kazich-depich-iii -> characters/kazich-depich-iii.html ----
    location / {
        expires 5m;
        add_header Cache-Control "public, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    # ---- Misc ----
    client_max_body_size 10M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
}
