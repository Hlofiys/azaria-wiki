# Security headers for the Azaria Wiki.
# Included at server level AND in every location that declares its own
# add_header — nginx drops inherited add_header directives in such locations.
#
# NOTE: no external auth/CMS vendors here — the Decap admin panel is not wired
# to any auth provider, so identity/unpkg sources are intentionally absent.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.iconify.design;" always;
